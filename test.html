<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sephiria Slash — Standalone Skill Test</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #eafcff; background: #060b10;
      background-image: radial-gradient(circle at 50% 18%, #14323b 0, #08141b 38%, #04070b 80%);
      overflow: hidden;
    }
    .app { width: min(100vw, 1100px); height: 100vh; display: grid; grid-template-columns: minmax(0, 720px) 290px; gap: 16px; padding: 14px; justify-content: center; }
    .game-shell {
      position: relative; min-height: 0; border: 1px solid #40727b; overflow: hidden;
      background: #102c31; box-shadow: 0 20px 70px #000b, inset 0 0 0 2px #071216;
    }
    canvas { width: 100%; height: 100%; display: block; object-fit: contain; image-rendering: pixelated; cursor: crosshair; }
    .badge {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); pointer-events: none;
      padding: 8px 14px 7px; text-align: center; letter-spacing: .08em;
      background: #061013d9; border: 1px solid #82eaf044; box-shadow: 0 4px 18px #0009;
    }
    .badge b { display: block; color: #6cecff; font-size: 15px; }
    .badge span { color: #d7f3f3; font-size: 10px; }
    .panel {
      align-self: center; padding: 18px; background: linear-gradient(180deg, #101c25ee, #080d13f2);
      border: 1px solid #27434d; box-shadow: 0 18px 50px #0008;
    }
    h1 { margin: 0; color: #fff; font-size: 19px; letter-spacing: .05em; }
    .sub { margin: 5px 0 18px; color: #71dce7; font-size: 11px; letter-spacing: .13em; }
    .control { margin: 15px 0; }
    .control label { display: flex; justify-content: space-between; color: #a9c3c9; font-size: 12px; }
    output { color: #fff; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin-top: 8px; accent-color: #55dceb; }
    button {
      width: 100%; margin-top: 8px; padding: 11px; color: #061216; font-weight: 800;
      letter-spacing: .07em; background: linear-gradient(#9cf9ff, #48c9da); border: 0; cursor: pointer;
      box-shadow: 0 4px 0 #176777;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #176777; }
    .keys { margin-top: 18px; padding-top: 14px; border-top: 1px solid #ffffff14; color: #8ca4aa; font-size: 12px; line-height: 1.8; }
    kbd { padding: 2px 5px; color: #dffcff; background: #152a31; border: 1px solid #385662; border-bottom-width: 2px; }
    .status { margin-top: 14px; min-height: 34px; color: #d9fbff; font-size: 12px; line-height: 1.5; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; padding: 8px; }
      .game-shell { height: min(78vh, 900px); }
      .panel { align-self: stretch; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="game-shell">
      <canvas id="game" width="720" height="960" aria-label="Phòng thử skill chém Sephiria"></canvas>
      <div class="badge"><b>SEPHIRIA · SLASH TEST</b><span>16-FRAME COMBO / TOP-DOWN ARENA</span></div>
    </section>

    <aside class="panel">
      <h1>PHÒNG THỬ SKILL</h1>
      <p class="sub">STANDALONE BUILD</p>

      <div class="control">
        <label for="fps">Tốc độ animation <output id="fpsOut">16 FPS</output></label>
        <input id="fps" type="range" min="8" max="28" value="16">
      </div>
      <div class="control">
        <label for="scale">Kích thước hiệu ứng <output id="scaleOut">100%</output></label>
        <input id="scale" type="range" min="60" max="150" value="100">
      </div>
      <div class="control">
        <label for="damage">Sát thương mỗi hit <output id="damageOut">160</output></label>
        <input id="damage" type="range" min="40" max="400" step="10" value="160">
      </div>

      <button id="cast">CHÉM THỬ</button>
      <button id="reset">HỒI PHỤC DUMMY</button>

      <div class="keys">
        <div><kbd>WASD</kbd> di chuyển</div>
        <div><kbd>Chuột</kbd> định hướng</div>
        <div><kbd>Click</kbd> / <kbd>Space</kbd> dùng skill</div>
        <div><kbd>R</kbd> hồi phục dummy</div>
      </div>
      <div id="status" class="status">Đang nạp 16 frame hiệu ứng…</div>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const W = canvas.width, H = canvas.height;
    const controls = {
      fps: document.querySelector('#fps'), scale: document.querySelector('#scale'),
      damage: document.querySelector('#damage'), status: document.querySelector('#status'),
    };
    const frames = Array.from({ length: 16 }, (_, i) => {
      const image = new Image();
      image.src = `kiem-frames/frame_${String(i + 1).padStart(2, '0')}.png`;
      return image;
    });

    const keys = new Set();
    const mouse = { x: W / 2, y: H / 3 };
    const hero = { x: W / 2, y: H * .69, angle: -Math.PI / 2, speed: 235 };
    const enemy = { x: W / 2, y: H * .31, hp: 2600, maxHp: 2600, flash: 0, deadFor: 0, bob: 0 };
    let slash = null, shake = 0, last = performance.now(), loaded = 0;
    const particles = [], numbers = [];

    frames.forEach(image => {
      image.addEventListener('load', () => {
        loaded++;
        controls.status.textContent = loaded === 16
          ? 'Sẵn sàng. Đưa nhân vật đến gần dummy rồi chém.'
          : `Đang nạp frame ${loaded}/16…`;
      });
    });

    function resetEnemy() {
      enemy.hp = enemy.maxHp; enemy.deadFor = 0; enemy.flash = 0;
      enemy.x = W / 2; enemy.y = H * .31;
      controls.status.textContent = 'Dummy đã hồi phục.';
    }

    function cast() {
      if (loaded < 16 || slash) return;
      hero.angle = Math.atan2(mouse.y - hero.y, mouse.x - hero.x);
      slash = { age: 0, hit: new Set(), angle: hero.angle };
      controls.status.textContent = 'Đang thi triển Sephiria Slash…';
    }

    function hitEnemy(hitIndex) {
      if (enemy.hp <= 0) return;
      const dx = enemy.x - hero.x, dy = enemy.y - hero.y;
      const distance = Math.hypot(dx, dy);
      const targetAngle = Math.atan2(dy, dx);
      const diff = Math.atan2(Math.sin(targetAngle - slash.angle), Math.cos(targetAngle - slash.angle));
      if (distance > 265 || Math.abs(diff) > 1.5) return;

      const damage = Number(controls.damage.value);
      enemy.hp = Math.max(0, enemy.hp - damage);
      enemy.flash = .12; shake = 7;
      const push = 8 + hitIndex * 1.5;
      enemy.x += Math.cos(slash.angle) * push;
      enemy.y += Math.sin(slash.angle) * push;
      numbers.push({ x: enemy.x, y: enemy.y - 55, value: damage, life: .7 });
      for (let i = 0; i < 10; i++) {
        const a = slash.angle + (Math.random() - .5) * 1.7;
        const speed = 80 + Math.random() * 180;
        particles.push({ x: enemy.x, y: enemy.y - 18, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: .35 + Math.random() * .25 });
      }
      if (enemy.hp === 0) {
        enemy.deadFor = 1.5;
        controls.status.textContent = 'Dummy bị hạ — tự hồi phục sau 1,5 giây.';
      }
    }

    function update(dt) {
      let dx = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
      let dy = (keys.has('KeyS') ? 1 : 0) - (keys.has('KeyW') ? 1 : 0);
      const len = Math.hypot(dx, dy) || 1;
      const moveMult = slash ? .42 : 1;
      hero.x = Math.max(55, Math.min(W - 55, hero.x + dx / len * hero.speed * moveMult * dt));
      hero.y = Math.max(150, Math.min(H - 115, hero.y + dy / len * hero.speed * moveMult * dt));
      hero.angle = Math.atan2(mouse.y - hero.y, mouse.x - hero.x);

      enemy.bob += dt * 3.4;
      enemy.flash = Math.max(0, enemy.flash - dt);
      if (enemy.deadFor > 0) {
        enemy.deadFor -= dt;
        if (enemy.deadFor <= 0) resetEnemy();
      }

      if (slash) {
        slash.age += dt;
        const fps = Number(controls.fps.value);
        const frame = Math.min(15, Math.floor(slash.age * fps));
        [3, 6, 10, 13].forEach((hitFrame, index) => {
          if (frame >= hitFrame && !slash.hit.has(hitFrame)) {
            slash.hit.add(hitFrame); hitEnemy(index);
          }
        });
        if (slash.age >= 16 / fps) {
          slash = null;
          if (enemy.hp > 0) controls.status.textContent = 'Combo hoàn tất. Có thể chém tiếp.';
        }
      }

      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
      for (const n of numbers) { n.y -= 45 * dt; n.life -= dt; }
      while (particles.length && particles[0].life <= 0) particles.shift();
      while (numbers.length && numbers[0].life <= 0) numbers.shift();
      shake *= Math.pow(.003, dt);
    }

    function drawBackground(t) {
      ctx.fillStyle = '#12383b'; ctx.fillRect(0, 0, W, H);
      for (let y = 130; y < H; y += 24) {
        for (let x = -20; x < W + 20; x += 34) {
          const offset = ((y / 24) % 2) * 17;
          ctx.strokeStyle = ((x + y) / 10) % 3 < 1 ? '#1b4a4b' : '#0d2d31';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x + offset, y + 8);
          ctx.quadraticCurveTo(x + 12 + offset, y - 3, x + 27 + offset, y + 3);
          ctx.stroke();
        }
      }
      ctx.fillStyle = '#071316cc'; ctx.fillRect(0, 0, W, 116);
      ctx.fillStyle = '#0a2024e6'; ctx.fillRect(0, H - 84, W, 84);
      for (let i = 0; i < 26; i++) {
        const x = (i * 97 + 43) % W, y = 135 + ((i * 151) % (H - 240));
        ctx.fillStyle = i % 3 ? '#f06b45' : '#76c9b9';
        ctx.fillRect(x, y, 3, 3);
      }
      void t;
    }

    function drawHero() {
      ctx.save(); ctx.translate(Math.round(hero.x), Math.round(hero.y));
      ctx.fillStyle = '#06101566'; ctx.beginPath(); ctx.ellipse(0, 8, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(hero.angle + Math.PI / 2);
      ctx.fillStyle = '#f6c94b'; ctx.fillRect(-18, -15, 36, 30);
      ctx.fillStyle = '#fff7dc'; ctx.fillRect(-13, -24, 26, 31);
      ctx.fillStyle = '#f3a83b'; ctx.fillRect(-9, -30, 18, 8);
      ctx.fillStyle = '#f4f7ff'; ctx.fillRect(10, -9, 8, 30);
      ctx.fillStyle = '#84eafa'; ctx.fillRect(12, -36, 5, 31);
      ctx.fillStyle = '#d8fbff'; ctx.fillRect(13, -52, 3, 19);
      ctx.fillStyle = '#17343f'; ctx.fillRect(-12, 7, 8, 20); ctx.fillRect(5, 7, 8, 20);
      ctx.restore();
    }

    function drawEnemy() {
      if (enemy.hp <= 0) return;
      const y = enemy.y + Math.sin(enemy.bob) * 5;
      ctx.save(); ctx.translate(Math.round(enemy.x), Math.round(y));
      if (enemy.flash > 0) ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = enemy.flash > 0 ? '#ffffff' : '#263044';
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-55, -7); ctx.lineTo(-30, 17); ctx.lineTo(0, 5); ctx.lineTo(30, 17); ctx.lineTo(55, -7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = enemy.flash > 0 ? '#dfffff' : '#3d455d'; ctx.fillRect(-18, -24, 36, 42);
      ctx.fillStyle = '#e63f38'; ctx.fillRect(-10, -14, 6, 6); ctx.fillRect(5, -14, 6, 6);
      ctx.fillStyle = '#1a1b29'; ctx.fillRect(-4, 16, 8, 15);
      ctx.restore();
    }

    function drawSlash() {
      if (!slash) return;
      const fps = Number(controls.fps.value);
      const frameIndex = Math.min(15, Math.floor(slash.age * fps));
      const scale = Number(controls.scale.value) / 100;
      const size = 410 * scale;
      ctx.save();
      ctx.translate(hero.x + Math.cos(slash.angle) * 44, hero.y - 24 + Math.sin(slash.angle) * 44);
      ctx.rotate(slash.angle + Math.PI / 2);
      ctx.globalCompositeOperation = 'lighter';
      for (let trail = 2; trail >= 0; trail--) {
        const index = Math.max(0, frameIndex - trail);
        ctx.globalAlpha = trail === 0 ? .98 : .14 / trail;
        ctx.drawImage(frames[index], -size / 2, -size / 2, size, size);
      }
      ctx.restore();
    }

    function drawHud() {
      const barX = 78, barY = H - 55, barW = W - 156, barH = 20;
      ctx.fillStyle = '#061013e8'; ctx.fillRect(barX - 8, barY - 24, barW + 16, 55);
      ctx.fillStyle = '#d7eff1'; ctx.font = 'bold 13px system-ui'; ctx.fillText('ABYSS WING · TRAINING DUMMY', barX, barY - 8);
      ctx.fillStyle = '#240b0d'; ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#e23d3d'; ctx.fillRect(barX + 3, barY + 3, (barW - 6) * (enemy.hp / enemy.maxHp), barH - 6);
      ctx.strokeStyle = '#d8e8e8'; ctx.lineWidth = 2; ctx.strokeRect(barX, barY, barW, barH);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${Math.ceil(enemy.hp)} / ${enemy.maxHp}`, W / 2, barY + 15); ctx.textAlign = 'left';
      for (const n of numbers) {
        ctx.globalAlpha = Math.min(1, n.life * 2.5); ctx.fillStyle = '#fff7b0';
        ctx.font = 'bold 19px monospace'; ctx.fillText(`-${n.value}`, n.x - 18, n.y);
      }
      ctx.globalAlpha = 1;
    }

    function render(t) {
      ctx.save(); ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
      drawBackground(t); drawEnemy(); drawHero(); drawSlash();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = '#baf8ff'; ctx.fillRect(p.x, p.y, 4, 2); }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; drawHud(); ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(.04, (now - last) / 1000); last = now;
      update(dt); render(now / 1000); requestAnimationFrame(loop);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (event.clientX - rect.left) * W / rect.width;
      mouse.y = (event.clientY - rect.top) * H / rect.height;
    }
    canvas.addEventListener('pointermove', pointerPosition);
    canvas.addEventListener('pointerdown', event => { pointerPosition(event); cast(); });
    window.addEventListener('keydown', event => {
      keys.add(event.code);
      if (event.code === 'Space') { event.preventDefault(); cast(); }
      if (event.code === 'KeyR') resetEnemy();
    });
    window.addEventListener('keyup', event => keys.delete(event.code));
    document.querySelector('#cast').addEventListener('click', cast);
    document.querySelector('#reset').addEventListener('click', resetEnemy);
    controls.fps.addEventListener('input', () => document.querySelector('#fpsOut').value = `${controls.fps.value} FPS`);
    controls.scale.addEventListener('input', () => document.querySelector('#scaleOut').value = `${controls.scale.value}%`);
    controls.damage.addEventListener('input', () => document.querySelector('#damageOut').value = controls.damage.value);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
