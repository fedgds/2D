<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sephiria Slash — Standalone Skill Test</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      color: #eafcff; background: #060b10;
      background-image: radial-gradient(circle at 50% 18%, #14323b 0, #08141b 38%, #04070b 80%);
      overflow: hidden;
    }
    .app { width: min(100vw, 1100px); height: 100vh; display: grid; grid-template-columns: minmax(0, 720px) 290px; gap: 16px; padding: 14px; justify-content: center; }
    .game-shell {
      position: relative; min-height: 0; border: 1px solid #40727b; overflow: hidden;
      background: #102c31; box-shadow: 0 20px 70px #000b, inset 0 0 0 2px #071216;
    }
    canvas { width: 100%; height: 100%; display: block; object-fit: contain; image-rendering: pixelated; cursor: crosshair; }
    .badge {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); pointer-events: none;
      padding: 8px 14px 7px; text-align: center; letter-spacing: .08em;
      background: #061013d9; border: 1px solid #82eaf044; box-shadow: 0 4px 18px #0009;
    }
    .badge b { display: block; color: #6cecff; font-size: 15px; }
    .badge span { color: #d7f3f3; font-size: 10px; }
    .panel {
      align-self: center; padding: 18px; background: linear-gradient(180deg, #101c25ee, #080d13f2);
      border: 1px solid #27434d; box-shadow: 0 18px 50px #0008;
    }
    h1 { margin: 0; color: #fff; font-size: 19px; letter-spacing: .05em; }
    .sub { margin: 5px 0 14px; color: #71dce7; font-size: 11px; letter-spacing: .13em; }
    .skill-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 17px; }
    .skill-picker .weapon-option {
      min-width: 0; margin: 0; padding: 8px 6px; color: #9bbbc2; font-size: 11px; font-weight: 750;
      letter-spacing: .035em; background: #101e26; border: 1px solid #2d4c56; box-shadow: none;
    }
    .skill-picker .weapon-option:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .skill-picker .weapon-option:hover { color: #e9fdff; border-color: #55909c; }
    .skill-picker .weapon-option.active {
      color: #061216; background: linear-gradient(#c5fbff, #5bd8e6); border-color: #9cf9ff;
      box-shadow: inset 0 -2px 0 #24899a;
    }
    .control { margin: 15px 0; }
    .control label { display: flex; justify-content: space-between; color: #a9c3c9; font-size: 12px; }
    output { color: #fff; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin-top: 8px; accent-color: #55dceb; }
    button {
      width: 100%; margin-top: 8px; padding: 11px; color: #061216; font-weight: 800;
      letter-spacing: .07em; background: linear-gradient(#9cf9ff, #48c9da); border: 0; cursor: pointer;
      box-shadow: 0 4px 0 #176777;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #176777; }
    button:disabled { opacity: .45; cursor: wait; transform: none; box-shadow: none; }
    .keys { margin-top: 18px; padding-top: 14px; border-top: 1px solid #ffffff14; color: #8ca4aa; font-size: 12px; line-height: 1.8; }
    kbd { padding: 2px 5px; color: #dffcff; background: #152a31; border: 1px solid #385662; border-bottom-width: 2px; }
    .status { margin-top: 14px; min-height: 34px; color: #d9fbff; font-size: 12px; line-height: 1.5; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; grid-template-columns: 1fr; padding: 8px; }
      .game-shell { height: min(78vh, 900px); }
      .panel { align-self: stretch; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="game-shell">
      <canvas id="game" width="720" height="960" aria-label="Phòng thử skill vũ khí"></canvas>
      <div class="badge"><b id="skillTitle">SEPHIRIA · SLASH</b><span id="skillMeta">KIẾM / 16-FRAME COMBO</span></div>
    </section>

    <aside class="panel">
      <h1>PHÒNG THỬ SKILL</h1>
      <p class="sub">STANDALONE BUILD</p>

      <div class="skill-picker" role="group" aria-label="Chọn vũ khí">
        <button class="weapon-option active" data-weapon="kiem" aria-pressed="true">1 · KIẾM</button>
        <button class="weapon-option" data-weapon="cung" aria-pressed="false">2 · CUNG</button>
        <button class="weapon-option" data-weapon="dao" aria-pressed="false">3 · ĐAO</button>
        <button class="weapon-option" data-weapon="gang" aria-pressed="false">4 · GĂNG</button>
        <button class="weapon-option" data-weapon="luoi-hai" aria-pressed="false">5 · LƯỠI HÁI</button>
      </div>

      <div class="control">
        <label for="fps">Tốc độ animation <output id="fpsOut">16 FPS</output></label>
        <input id="fps" type="range" min="8" max="28" value="16">
      </div>
      <div class="control">
        <label for="scale">Kích thước hiệu ứng <output id="scaleOut">100%</output></label>
        <input id="scale" type="range" min="60" max="150" value="100">
      </div>
      <div class="control">
        <label for="damage">Sát thương mỗi hit <output id="damageOut">160</output></label>
        <input id="damage" type="range" min="40" max="400" step="10" value="160">
      </div>

      <button id="cast">DÙNG SEPHIRIA SLASH</button>
      <button id="reset">HỒI PHỤC DUMMY</button>

      <div class="keys">
        <div><kbd>WASD</kbd> di chuyển</div>
        <div><kbd>Chuột</kbd> định hướng</div>
        <div><kbd>Click</kbd> / <kbd>Space</kbd> dùng skill</div>
        <div><kbd>1–5</kbd> / <kbd>Q E</kbd> đổi vũ khí</div>
        <div><kbd>R</kbd> hồi phục dummy</div>
      </div>
      <div id="status" class="status">Đang nạp hiệu ứng vũ khí…</div>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const W = canvas.width, H = canvas.height;
    const controls = {
      fps: document.querySelector('#fps'), scale: document.querySelector('#scale'),
      damage: document.querySelector('#damage'), status: document.querySelector('#status'),
    };
    const castButton = document.querySelector('#cast');
    const skillTitle = document.querySelector('#skillTitle');
    const skillMeta = document.querySelector('#skillMeta');
    const weaponButtons = [...document.querySelectorAll('.weapon-option')];
    // spriteAxis = the direction the painted effect faces inside its own PNG
    // (0 = +X / right, +Y = down). drawSlash rotates by angle - spriteAxis, which
    // lands that axis exactly on the crosshair line, so every skill fires straight.
    // -PI/2 means "the art points up", which is what the pixel-art sets do.
    const SPRITE_UP = -Math.PI / 2;
    const WEAPONS = [
      {
        id: 'kiem', label: 'KIẾM', skill: 'SEPHIRIA SLASH', folder: 'kiem-frames',
        hitFrames: [3, 6, 10, 13], range: 265, arc: 1.5, effectSize: 410,
        spriteAxis: SPRITE_UP, travel: 0, push: 8,
      },
      {
        id: 'cung', label: 'CUNG', skill: 'CELESTIAL ARROW', folder: 'cung-frames',
        hitFrames: [8], range: 650, arc: .55, effectSize: 350,
        // Measured off the frames: the crescent bulges right and ~30 deg down.
        spriteAxis: .515, travel: 430, push: 18,
        // The arc drifts across its 338px canvas frame to frame. Anchor every frame
        // at its own centre of curvature so the swing pivots on one fixed point
        // instead of sliding sideways as the crescent grows.
        frameBox: 338,
        pivots: [
          [.5646, .5886], [.4256, .4809], [.4004, .5667], [.3104, .5920],
          [.5477, .5349], [.5277, .5470], [.3802, .5261], [.3527, .5277],
          [.5930, .4610], [.4992, .4915], [.4562, .5054], [.4144, .5171],
          [.5464, .3693], [.4505, .3790], [.4142, .4012], [.3634, .4033],
        ],
      },
      {
        id: 'dao', label: 'ĐAO', skill: 'MOON TIDE', folder: 'dao-frames',
        hitFrames: [4, 8, 12], range: 285, arc: 1.55, effectSize: 455,
        spriteAxis: -.072, travel: 20, push: 10,
        // These frames are trimmed to their painted bounds, so they all differ in
        // size. frameBox scales them against one shared box (a small frame stays
        // small) and pivots keeps the swing centre still.
        frameBox: 303,
        pivots: [
          [.5126, .4259], [.5052, .4521], [.5370, .5147], [.4851, .5067],
          [.4700, .5075], [.5361, .4894], [.4758, .4756], [.5438, .4894],
          [.4757, .4944], [.4779, .4912], [.4753, .5278], [.5022, .5112],
          [.5440, .5181], [.4687, .5001], [.4294, .5098], [.5709, .4981],
        ],
      },
      {
        id: 'gang', label: 'GĂNG', skill: 'ABYSSAL FIST', folder: 'gang-frames',
        hitFrames: [2, 5, 8, 11, 14], range: 205, arc: 1.15, effectSize: 340,
        spriteAxis: SPRITE_UP, travel: 55, push: 5,
      },
      {
        id: 'luoi-hai', label: 'LƯỠI HÁI', skill: 'REAPER SURGE', folder: 'luoi-hai-frames',
        hitFrames: [4, 9, 13], range: 335, arc: 2.25, effectSize: 430,
        spriteAxis: SPRITE_UP, travel: 35, push: 12,
      },
    ];
    let activeWeapon = WEAPONS[0];

    WEAPONS.forEach(weapon => {
      weapon.loaded = 0;
      weapon.failed = 0;
      weapon.frames = Array.from({ length: 16 }, (_, i) => {
        const image = new Image();
        image.addEventListener('load', () => {
          weapon.loaded++;
          if (weapon === activeWeapon) updateWeaponStatus();
        });
        image.addEventListener('error', () => {
          weapon.failed++;
          if (weapon === activeWeapon) updateWeaponStatus();
        });
        image.src = `${weapon.folder}/frame_${String(i + 1).padStart(2, '0')}.png`;
        return image;
      });
    });

    const keys = new Set();
    const mouse = { x: W / 2, y: H / 3 };
    const hero = { x: W / 2, y: H * .69, angle: -Math.PI / 2, speed: 235 };
    const enemy = { x: W / 2, y: H * .31, hp: 2600, maxHp: 2600, flash: 0, deadFor: 0, bob: 0 };
    let slash = null, shake = 0, last = performance.now();
    const particles = [], numbers = [];

    function updateWeaponStatus(selected = false) {
      castButton.disabled = activeWeapon.loaded < 16 || activeWeapon.failed > 0;
      if (activeWeapon.failed > 0) {
        controls.status.textContent = `Không thể nạp ${activeWeapon.failed} frame của ${activeWeapon.label.toLowerCase()}.`;
      } else if (activeWeapon.loaded < 16) {
        controls.status.textContent = `Đang nạp ${activeWeapon.label.toLowerCase()}: ${activeWeapon.loaded}/16 frame…`;
      } else {
        controls.status.textContent = selected
          ? `Đã chọn ${activeWeapon.skill}. Sẵn sàng thi triển.`
          : `Sẵn sàng. ${activeWeapon.skill} đã nạp đủ 16 frame.`;
      }
    }

    function selectWeapon(id) {
      const nextWeapon = WEAPONS.find(weapon => weapon.id === id);
      if (!nextWeapon) return;
      activeWeapon = nextWeapon;
      skillTitle.textContent = activeWeapon.skill;
      skillMeta.textContent = `${activeWeapon.label} / 16-FRAME SKILL`;
      castButton.textContent = `DÙNG ${activeWeapon.skill}`;
      weaponButtons.forEach(button => {
        const active = button.dataset.weapon === activeWeapon.id;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      updateWeaponStatus(true);
    }

    function resetEnemy() {
      enemy.hp = enemy.maxHp; enemy.deadFor = 0; enemy.flash = 0;
      enemy.x = W / 2; enemy.y = H * .31;
      controls.status.textContent = 'Dummy đã hồi phục.';
    }

    function cast() {
      if (activeWeapon.loaded < 16 || activeWeapon.failed > 0 || slash) return;
      hero.angle = Math.atan2(mouse.y - hero.y, mouse.x - hero.x);
      slash = { age: 0, hit: new Set(), angle: hero.angle, weapon: activeWeapon };
      controls.status.textContent = `Đang thi triển ${slash.weapon.skill}…`;
    }

    function hitEnemy(hitIndex) {
      if (enemy.hp <= 0) return;
      const dx = enemy.x - hero.x, dy = enemy.y - hero.y;
      const distance = Math.hypot(dx, dy);
      const targetAngle = Math.atan2(dy, dx);
      const diff = Math.atan2(Math.sin(targetAngle - slash.angle), Math.cos(targetAngle - slash.angle));
      if (distance > slash.weapon.range || Math.abs(diff) > slash.weapon.arc) return;

      const damage = Number(controls.damage.value);
      enemy.hp = Math.max(0, enemy.hp - damage);
      enemy.flash = .12; shake = 7;
      const push = slash.weapon.push + hitIndex * 1.5;
      enemy.x += Math.cos(slash.angle) * push;
      enemy.y += Math.sin(slash.angle) * push;
      numbers.push({ x: enemy.x, y: enemy.y - 55, value: damage, life: .7 });
      for (let i = 0; i < 10; i++) {
        const a = slash.angle + (Math.random() - .5) * 1.7;
        const speed = 80 + Math.random() * 180;
        particles.push({ x: enemy.x, y: enemy.y - 18, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: .35 + Math.random() * .25 });
      }
      if (enemy.hp === 0) {
        enemy.deadFor = 1.5;
        controls.status.textContent = 'Dummy bị hạ — tự hồi phục sau 1,5 giây.';
      }
    }

    function update(dt) {
      let dx = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
      let dy = (keys.has('KeyS') ? 1 : 0) - (keys.has('KeyW') ? 1 : 0);
      const len = Math.hypot(dx, dy) || 1;
      const moveMult = slash ? .42 : 1;
      hero.x = Math.max(55, Math.min(W - 55, hero.x + dx / len * hero.speed * moveMult * dt));
      hero.y = Math.max(150, Math.min(H - 115, hero.y + dy / len * hero.speed * moveMult * dt));
      hero.angle = Math.atan2(mouse.y - hero.y, mouse.x - hero.x);

      enemy.bob += dt * 3.4;
      enemy.flash = Math.max(0, enemy.flash - dt);
      if (enemy.deadFor > 0) {
        enemy.deadFor -= dt;
        if (enemy.deadFor <= 0) resetEnemy();
      }

      if (slash) {
        slash.age += dt;
        const fps = Number(controls.fps.value);
        const frame = Math.min(slash.weapon.frames.length - 1, Math.floor(slash.age * fps));
        slash.weapon.hitFrames.forEach((hitFrame, index) => {
          if (frame >= hitFrame && !slash.hit.has(hitFrame)) {
            slash.hit.add(hitFrame); hitEnemy(index);
          }
        });
        if (slash.age >= slash.weapon.frames.length / fps) {
          const completedSkill = slash.weapon.skill;
          slash = null;
          if (enemy.hp > 0) controls.status.textContent = `${completedSkill} hoàn tất. Có thể dùng skill tiếp.`;
        }
      }

      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; p.life -= dt; }
      for (const n of numbers) { n.y -= 45 * dt; n.life -= dt; }
      while (particles.length && particles[0].life <= 0) particles.shift();
      while (numbers.length && numbers[0].life <= 0) numbers.shift();
      shake *= Math.pow(.003, dt);
    }

    function drawBackground(t) {
      ctx.fillStyle = '#12383b'; ctx.fillRect(0, 0, W, H);
      for (let y = 130; y < H; y += 24) {
        for (let x = -20; x < W + 20; x += 34) {
          const offset = ((y / 24) % 2) * 17;
          ctx.strokeStyle = ((x + y) / 10) % 3 < 1 ? '#1b4a4b' : '#0d2d31';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x + offset, y + 8);
          ctx.quadraticCurveTo(x + 12 + offset, y - 3, x + 27 + offset, y + 3);
          ctx.stroke();
        }
      }
      ctx.fillStyle = '#071316cc'; ctx.fillRect(0, 0, W, 116);
      ctx.fillStyle = '#0a2024e6'; ctx.fillRect(0, H - 84, W, 84);
      for (let i = 0; i < 26; i++) {
        const x = (i * 97 + 43) % W, y = 135 + ((i * 151) % (H - 240));
        ctx.fillStyle = i % 3 ? '#f06b45' : '#76c9b9';
        ctx.fillRect(x, y, 3, 3);
      }
      void t;
    }

    function drawHeldWeapon() {
      switch (activeWeapon.id) {
        case 'cung':
          ctx.strokeStyle = '#79e8f4'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(18, -45); ctx.quadraticCurveTo(38, -17, 19, 14); ctx.stroke();
          ctx.strokeStyle = '#d9fdff'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(18, -45); ctx.lineTo(24, -16); ctx.lineTo(19, 14); ctx.stroke();
          ctx.fillStyle = '#ecfdff'; ctx.fillRect(22, -42, 3, 55);
          ctx.beginPath(); ctx.moveTo(23, -49); ctx.lineTo(17, -38); ctx.lineTo(29, -38); ctx.closePath(); ctx.fill();
          break;
        case 'dao':
          ctx.fillStyle = '#294b57'; ctx.fillRect(12, -4, 7, 29);
          ctx.fillStyle = '#baf7ff';
          ctx.beginPath(); ctx.moveTo(13, -5); ctx.lineTo(9, -48); ctx.quadraticCurveTo(31, -39, 23, -5); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ffffff'; ctx.fillRect(13, -43, 3, 34);
          break;
        case 'gang':
          ctx.fillStyle = '#65dcec'; ctx.fillRect(-25, -19, 13, 23); ctx.fillRect(13, -19, 13, 23);
          ctx.fillStyle = '#d9fbff'; ctx.fillRect(-23, -23, 9, 8); ctx.fillRect(15, -23, 9, 8);
          ctx.fillStyle = '#2d7080'; ctx.fillRect(-25, 1, 13, 6); ctx.fillRect(13, 1, 13, 6);
          break;
        case 'luoi-hai':
          ctx.strokeStyle = '#28525e'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(17, 19); ctx.lineTo(13, -48); ctx.stroke();
          ctx.strokeStyle = '#bdf9ff'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(13, -47); ctx.quadraticCurveTo(-18, -60, -36, -32); ctx.quadraticCurveTo(-13, -43, 14, -38); ctx.stroke();
          ctx.fillStyle = '#eaffff'; ctx.fillRect(11, -51, 5, 8);
          break;
        default:
          ctx.fillStyle = '#f4f7ff'; ctx.fillRect(10, -9, 8, 30);
          ctx.fillStyle = '#84eafa'; ctx.fillRect(12, -36, 5, 31);
          ctx.fillStyle = '#d8fbff'; ctx.fillRect(13, -52, 3, 19);
      }
    }

    function drawHero() {
      ctx.save(); ctx.translate(Math.round(hero.x), Math.round(hero.y));
      ctx.fillStyle = '#06101566'; ctx.beginPath(); ctx.ellipse(0, 8, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.rotate(hero.angle + Math.PI / 2);
      ctx.fillStyle = '#f6c94b'; ctx.fillRect(-18, -15, 36, 30);
      ctx.fillStyle = '#fff7dc'; ctx.fillRect(-13, -24, 26, 31);
      ctx.fillStyle = '#f3a83b'; ctx.fillRect(-9, -30, 18, 8);
      ctx.fillStyle = '#17343f'; ctx.fillRect(-12, 7, 8, 20); ctx.fillRect(5, 7, 8, 20);
      drawHeldWeapon();
      ctx.restore();
    }

    function drawEnemy() {
      if (enemy.hp <= 0) return;
      const y = enemy.y + Math.sin(enemy.bob) * 5;
      ctx.save(); ctx.translate(Math.round(enemy.x), Math.round(y));
      if (enemy.flash > 0) ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = enemy.flash > 0 ? '#ffffff' : '#263044';
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(-55, -7); ctx.lineTo(-30, 17); ctx.lineTo(0, 5); ctx.lineTo(30, 17); ctx.lineTo(55, -7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = enemy.flash > 0 ? '#dfffff' : '#3d455d'; ctx.fillRect(-18, -24, 36, 42);
      ctx.fillStyle = '#e63f38'; ctx.fillRect(-10, -14, 6, 6); ctx.fillRect(5, -14, 6, 6);
      ctx.fillStyle = '#1a1b29'; ctx.fillRect(-4, 16, 8, 15);
      ctx.restore();
    }

    function drawSlash() {
      if (!slash) return;
      const fps = Number(controls.fps.value);
      const weapon = slash.weapon;
      const frameIndex = Math.min(weapon.frames.length - 1, Math.floor(slash.age * fps));
      const scale = Number(controls.scale.value) / 100;
      const size = weapon.effectSize * scale;
      // Keep travel continuous even though the sprite itself advances frame by frame.
      const progress = Math.min(1, slash.age * fps / (weapon.frames.length - 1));
      const offset = 44 + weapon.travel * progress;
      ctx.save();
      ctx.translate(hero.x + Math.cos(slash.angle) * offset, hero.y + Math.sin(slash.angle) * offset);
      ctx.rotate(slash.angle - weapon.spriteAxis);
      ctx.globalCompositeOperation = 'lighter';
      for (let trail = 2; trail >= 0; trail--) {
        const index = Math.max(0, frameIndex - trail);
        const image = weapon.frames[index];
        if (!image.complete || !image.naturalWidth) continue;
        // Scale against one shared box so trimmed frames keep their relative size.
        const fit = size / (weapon.frameBox ?? Math.max(image.naturalWidth, image.naturalHeight));
        const drawWidth = image.naturalWidth * fit;
        const drawHeight = image.naturalHeight * fit;
        const pivot = weapon.pivots?.[index] ?? [.5, .5];
        ctx.globalAlpha = trail === 0 ? .98 : .14 / trail;
        ctx.drawImage(
          image,
          -pivot[0] * drawWidth,
          -pivot[1] * drawHeight,
          drawWidth,
          drawHeight,
        );
      }
      ctx.restore();
    }

    function drawHud() {
      const barX = 78, barY = H - 55, barW = W - 156, barH = 20;
      ctx.fillStyle = '#061013e8'; ctx.fillRect(barX - 8, barY - 24, barW + 16, 55);
      ctx.fillStyle = '#d7eff1'; ctx.font = 'bold 13px system-ui'; ctx.fillText('ABYSS WING · TRAINING DUMMY', barX, barY - 8);
      ctx.fillStyle = '#240b0d'; ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = '#e23d3d'; ctx.fillRect(barX + 3, barY + 3, (barW - 6) * (enemy.hp / enemy.maxHp), barH - 6);
      ctx.strokeStyle = '#d8e8e8'; ctx.lineWidth = 2; ctx.strokeRect(barX, barY, barW, barH);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${Math.ceil(enemy.hp)} / ${enemy.maxHp}`, W / 2, barY + 15); ctx.textAlign = 'left';
      for (const n of numbers) {
        ctx.globalAlpha = Math.min(1, n.life * 2.5); ctx.fillStyle = '#fff7b0';
        ctx.font = 'bold 19px monospace'; ctx.fillText(`-${n.value}`, n.x - 18, n.y);
      }
      ctx.globalAlpha = 1;
    }

    function render(t) {
      ctx.save(); ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
      drawBackground(t); drawEnemy(); drawHero(); drawSlash();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = '#baf8ff'; ctx.fillRect(p.x, p.y, 4, 2); }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; drawHud(); ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(.04, (now - last) / 1000); last = now;
      update(dt); render(now / 1000); requestAnimationFrame(loop);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (event.clientX - rect.left) * W / rect.width;
      mouse.y = (event.clientY - rect.top) * H / rect.height;
    }
    canvas.addEventListener('pointermove', pointerPosition);
    canvas.addEventListener('pointerdown', event => { pointerPosition(event); cast(); });
    window.addEventListener('keydown', event => {
      keys.add(event.code);
      if (event.code === 'Space') { event.preventDefault(); cast(); }
      if (event.code === 'KeyR') resetEnemy();
      if (/^Digit[1-5]$/.test(event.code)) selectWeapon(WEAPONS[Number(event.code.slice(-1)) - 1].id);
      if (event.code === 'KeyQ' || event.code === 'KeyE') {
        const direction = event.code === 'KeyQ' ? -1 : 1;
        const index = WEAPONS.indexOf(activeWeapon);
        selectWeapon(WEAPONS[(index + direction + WEAPONS.length) % WEAPONS.length].id);
      }
    });
    window.addEventListener('keyup', event => keys.delete(event.code));
    weaponButtons.forEach(button => button.addEventListener('click', () => selectWeapon(button.dataset.weapon)));
    castButton.addEventListener('click', cast);
    document.querySelector('#reset').addEventListener('click', resetEnemy);
    controls.fps.addEventListener('input', () => document.querySelector('#fpsOut').value = `${controls.fps.value} FPS`);
    controls.scale.addEventListener('input', () => document.querySelector('#scaleOut').value = `${controls.scale.value}%`);
    controls.damage.addEventListener('input', () => document.querySelector('#damageOut').value = controls.damage.value);
    selectWeapon('kiem');
    requestAnimationFrame(loop);
  </script>
</body>
</html>
